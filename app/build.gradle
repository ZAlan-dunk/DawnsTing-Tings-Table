plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('TINGS_TABLE_KEYSTORE')
def releaseStorePassword = System.getenv('TINGS_TABLE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('TINGS_TABLE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('TINGS_TABLE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def recipeCollectionApiUrl = System.getenv('RECIPE_COLLECTION_API_URL') ?: ''
def buildConfigString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.dawns.tingstable'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dawns.tingstable'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '0.6.7-Bata'

        buildConfigField 'String', 'RECIPE_CLOUD_PROFILE_ID', buildConfigString('tings')
        buildConfigField 'String', 'RECIPE_COLLECTION_API_URL', buildConfigString(recipeCollectionApiUrl)

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
