plugins {
    id 'com.android.application' version '8.13.0' apply false
}

// CI or local automation can redirect generated outputs without hard-coding a machine path.
def externalBuildRootPath = System.getenv('TINGS_TABLE_BUILD_ROOT')
if (externalBuildRootPath) {
    def externalBuildRoot = new File(externalBuildRootPath)
    layout.buildDirectory.set(new File(externalBuildRoot, 'root'))
    subprojects {
        layout.buildDirectory.set(new File(externalBuildRoot, project.name))
    }
}
