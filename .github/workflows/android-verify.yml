name: Android verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease

      - name: Upload APK outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LazySheepChef-v0.6.0-Bata-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
